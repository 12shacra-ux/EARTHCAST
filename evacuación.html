
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>EARTHCAST - Evacuación</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }

    header {
      padding: 15px;
      background: #172b3a;
    }

    #map {
      width: 100%;
      height: 75vh;
    }

    button {
      padding: 12px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #status {
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h2>EARTHCAST</h2>
    <p>Mapa de evacuación de Quito</p>
  </header>

  <div id="status">GPS desactivado</div>

  <button onclick="iniciarGPS()">
    Mi ubicación
  </button>

  <button onclick="centrarUsuario()">
    Centrar mapa
  </button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="evacuación.js"></script>

</body>
</html>
